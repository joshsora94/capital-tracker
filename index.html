<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f5f5f7"
    >

    <title>我的投資資產</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="icons/icon-192.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<main class="app">


    <!-- =========================
         標題
    ========================== -->

    <header class="page-header">

        <div>

            <p class="subtitle">
                資產追蹤
            </p>

            <h1>
                我的投資資產
            </h1>

        </div>


        <button
            id="manageButton"
            class="icon-button"
            type="button"
        >
            ⋯
        </button>

    </header>


    <!-- =========================
         帳戶總資產
    ========================== -->

    <section class="total-card">

        <p class="card-label">
            目前帳戶資產
        </p>

        <h2 id="totalAssets">
            NT$ 0
        </h2>


        <div class="profit-row">

            <span>
                總損益
            </span>

            <strong id="profit">
                NT$ 0
            </strong>

        </div>


        <div class="profit-row">

            <span>
                總報酬率
            </span>

            <strong id="returnRate">
                0.00%
            </strong>

        </div>


        <p class="valuation-note">
            尚未賣出的股票以持股成本計算，因此目前損益主要反映已實現的投資損益。
        </p>

    </section>


    <!-- =========================
         資產摘要
    ========================== -->

    <section class="stats four-stats">


        <div class="stat-card">

            <span>
                累積入金
            </span>

            <strong id="totalDeposit">
                NT$ 0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                累積出金
            </span>

            <strong id="totalWithdraw">
                NT$ 0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                現金
            </span>

            <strong id="cash">
                NT$ 0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                持股成本
            </span>

            <strong id="stockValue">
                NT$ 0
            </strong>

        </div>

    </section>


    <!-- 淨投入 -->

    <section class="net-card">

        <span>
            目前淨投入
        </span>

        <strong id="netDeposit">
            NT$ 0
        </strong>

    </section>


    <!-- =========================
         新增紀錄
    ========================== -->

    <button
        id="addButton"
        class="add-button"
        type="button"
    >
        ＋ 新增紀錄
    </button>


    <!-- =========================
         目前持股
    ========================== -->

    <section class="holdings">

        <div class="section-title-row">

            <h3>
                目前持股
            </h3>

            <span
                id="holdingCount"
                class="section-count"
            >
                0 檔
            </span>

        </div>


        <div
            id="holdingList"
            class="empty"
        >
            尚無持股
        </div>

    </section>


    <!-- =========================
         最近紀錄
    ========================== -->

    <section class="records">

        <div class="section-title-row">

            <h3>
                最近紀錄
            </h3>

            <span
                id="recordCount"
                class="section-count"
            >
                0 筆
            </span>

        </div>


        <div
            id="recordList"
            class="empty"
        >
            尚無紀錄
        </div>

    </section>

</main>



<!-- =========================
     新增 / 編輯紀錄
========================== -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                新增紀錄
            </h2>

            <button
                id="closeButton"
                class="close-button"
                type="button"
            >
                ×
            </button>

        </div>


        <form id="transactionForm">


            <!-- 類型 -->

            <label for="type">
                類型
            </label>

            <select
                id="type"
                required
            >

                <option value="deposit">
                    入金
                </option>

                <option value="withdraw">
                    出金
                </option>

                <option value="buy">
                    買入股票
                </option>

                <option value="sell">
                    賣出股票
                </option>

            </select>


            <!-- 股票名稱 -->

            <div id="stockNameField">

                <label for="stockName">
                    股票名稱
                </label>

                <input
                    id="stockName"
                    type="text"
                    maxlength="40"
                    list="stockSuggestions"
                    autocomplete="off"
                    placeholder="例如：台積電"
                >

                <datalist id="stockSuggestions">
                </datalist>

            </div>


            <!-- 一般金額 / 買入金額 -->

            <div id="amountField">

                <label
                    for="amount"
                    id="amountLabel"
                >
                    金額
                </label>

                <input
                    id="amount"
                    type="number"
                    step="1"
                    inputmode="numeric"
                    placeholder="例如：50000"
                >

            </div>


            <!-- 賣出損益 -->

            <div id="pnlField">

                <label for="pnl">
                    這次賺 / 賠多少
                </label>

                <input
                    id="pnl"
                    type="number"
                    step="1"
                    inputmode="numeric"
                    placeholder="賺 2500 輸入 2500，賠 2500 輸入 -2500"
                >

                <p class="field-hint">
                    正數代表獲利，例如 2500；負數代表虧損，例如 -2500。
                    賣出會視為這檔股票目前的持股全部賣掉。
                </p>

            </div>


            <!-- 日期 -->

            <label for="date">
                日期
            </label>

            <input
                id="date"
                type="date"
                required
            >


            <!-- 備註 -->

            <label for="note">
                備註
            </label>

            <input
                id="note"
                type="text"
                maxlength="100"
                placeholder="選填"
            >


            <div
                id="formError"
                class="form-error"
                hidden
            >
            </div>


            <div class="form-buttons">

                <button
                    id="cancelButton"
                    class="cancel-button"
                    type="button"
                >
                    取消
                </button>


                <button
                    class="save-button"
                    type="submit"
                >
                    儲存
                </button>

            </div>

        </form>

    </div>

</div>



<!-- =========================
     資料管理
========================== -->

<div
    id="manageModal"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                資料管理
            </h2>

            <button
                id="closeManageButton"
                class="close-button"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="manage-actions">

            <button
                id="backupButton"
                class="secondary-button"
                type="button"
            >
                備份 JSON
            </button>


            <button
                id="csvButton"
                class="secondary-button"
                type="button"
            >
                匯出 CSV
            </button>


            <button
                id="importButton"
                class="secondary-button"
                type="button"
            >
                匯入備份
            </button>


            <input
                id="importFile"
                type="file"
                accept=".json,application/json"
                hidden
            >


            <button
                id="resetButton"
                class="danger-button"
                type="button"
            >
                清空所有資料
            </button>

        </div>


        <p class="manage-note">
            資料目前保存在這台裝置的瀏覽器中，正式使用後建議定期下載 JSON 備份。
        </p>

    </div>

</div>



<!-- 提示訊息 -->

<div
    id="toast"
    class="toast"
>
</div>


<script src="app.js"></script>

</body>

</html>
