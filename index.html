<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>我的投資資產</title>
  <link rel="stylesheet" href="style.css?v=5.0.0">
</head>
<body>
<main class="app">
  <header class="page-header">
    <div>
      <p class="subtitle">資產追蹤</p>
      <h1>我的投資資產</h1>
    </div>
    <button id="manageButton" class="icon-button" type="button" aria-label="資料管理">⋯</button>
  </header>

  <section class="total-card">
    <p class="card-label">目前帳戶資產</p>
    <h2 id="totalAssets">NT$ 0</h2>
    <div class="profit-row"><span>總損益</span><strong id="profit">NT$ 0</strong></div>
    <div class="profit-row"><span>總報酬率</span><strong id="returnRate">0.00%</strong></div>
    <p class="valuation-note">未賣出的股票以持股成本計入，因此這裡主要反映已實現損益。</p>
  </section>

  <section class="stats">
    <div class="stat-card"><span>淨投入</span><strong id="netDeposit">NT$ 0</strong></div>
    <div class="stat-card"><span>現金</span><strong id="cash">NT$ 0</strong></div>
    <div class="stat-card"><span>持股成本</span><strong id="stockValue">NT$ 0</strong></div>
  </section>

  <button id="addButton" class="add-button" type="button">＋ 新增紀錄</button>

  <section class="analysis-section">
    <div class="section-title-row">
      <h3>損益分析</h3>
      <span class="section-count">已實現損益</span>
    </div>

    <div class="analysis-card">
      <div class="quick-range">
        <button type="button" class="range-button" data-range="7">最近 7 天</button>
        <button type="button" class="range-button" data-range="30">最近 30 天</button>
        <button type="button" class="range-button" data-range="month">本月</button>
        <button type="button" class="range-button" data-range="year">今年</button>
      </div>

      <div class="date-range">
        <div>
          <label for="analysisStart">開始日期</label>
          <input id="analysisStart" type="date">
        </div>
        <div>
          <label for="analysisEnd">結束日期</label>
          <input id="analysisEnd" type="date">
        </div>
      </div>

      <button id="analyzeButton" class="analyze-button" type="button">查詢這段期間</button>

      <div class="analysis-summary">
        <div><span>期間淨損益</span><strong id="periodNet">NT$ 0</strong></div>
        <div><span>總獲利</span><strong id="periodProfit">NT$ 0</strong></div>
        <div><span>總虧損</span><strong id="periodLoss">NT$ 0</strong></div>
      </div>

      <div id="stockAnalysisList" class="analysis-empty">這段期間尚無股票賣出紀錄</div>
    </div>
  </section>

  <section class="holdings">
    <div class="section-title-row"><h3>目前持股</h3><span id="holdingCount" class="section-count">0 檔</span></div>
    <div id="holdingList" class="empty">尚無持股</div>
  </section>

  <section class="records">
    <div class="section-title-row"><h3>最近紀錄</h3><span id="recordCount" class="section-count">0 筆</span></div>
    <div id="recordList" class="empty">尚無紀錄</div>
  </section>
</main>

<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">新增紀錄</h2>
      <button id="closeButton" class="close-button" type="button">×</button>
    </div>

    <form id="transactionForm">
      <label for="type">類型</label>
      <select id="type" required>
        <option value="deposit">入金</option>
        <option value="withdraw">出金</option>
        <option value="buy">買入股票</option>
        <option value="sell">賣出股票</option>
      </select>

      <div id="stockNameField" class="conditional-field">
        <label for="stockName">股票名稱</label>
        <input id="stockName" type="text" maxlength="40" list="stockSuggestions" autocomplete="off" placeholder="例如：台積電">
        <datalist id="stockSuggestions"></datalist>
      </div>

      <div id="buySharesField" class="conditional-field">
        <label for="buyShares">買入股數</label>
        <input id="buyShares" type="number" min="1" step="1" inputmode="numeric" placeholder="例如：100">
      </div>

      <div id="amountField">
        <label id="amountLabel" for="amount">金額</label>
        <input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="例如：50000">
      </div>

      <div id="sellSharesField" class="conditional-field">
        <label for="sellShares">賣出股數</label>
        <input id="sellShares" type="number" min="1" step="1" inputmode="numeric" placeholder="例如：30">
        <p id="sellSharesHint" class="field-hint">可部分賣出，系統會依平均成本計算賣出部分的成本。</p>
      </div>

      <div id="pnlField" class="conditional-field">
        <label>這次是賺錢還是賠錢？</label>
        <div class="pnl-buttons">
          <button id="profitButton" class="pnl-button selected" type="button">賺錢</button>
          <button id="lossButton" class="pnl-button" type="button">賠錢</button>
        </div>
        <label for="pnlAmount">損益金額</label>
        <input id="pnlAmount" type="number" min="0" step="1" inputmode="numeric" placeholder="例如：2500">
        <p class="field-hint">只輸入正數即可，不需要在 iPhone 輸入負號。</p>
      </div>

      <label for="date">日期</label>
      <input id="date" type="date" required>

      <label for="note">備註</label>
      <input id="note" type="text" maxlength="100" placeholder="選填">

      <div id="formError" class="form-error" hidden></div>

      <div class="form-buttons">
        <button id="cancelButton" class="cancel-button" type="button">取消</button>
        <button class="save-button" type="submit">儲存</button>
      </div>
    </form>
  </div>
</div>

<div id="manageModal" class="modal" aria-hidden="true">
  <div class="modal-content">
    <div class="modal-header">
      <h2>資料管理</h2>
      <button id="closeManageButton" class="close-button" type="button">×</button>
    </div>
    <div class="manage-actions">
      <button id="backupButton" class="secondary-button" type="button">備份 JSON</button>
      <button id="csvButton" class="secondary-button" type="button">匯出 CSV</button>
      <button id="importButton" class="secondary-button" type="button">匯入備份</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
      <button id="resetButton" class="danger-button" type="button">清空所有資料</button>
    </div>
    <p class="field-hint">資料保存在這台裝置的瀏覽器中，建議定期下載 JSON 備份。</p>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=5.0.0"></script>
</body>
</html>
