<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Capital Tracker 資料救援</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#1d1d1f}
main{max-width:560px;margin:0 auto;padding:24px 16px 60px}h1{font-size:26px;margin:0 0 10px}p{line-height:1.6;color:#666}
.card{background:#fff;border-radius:18px;padding:18px;margin-top:16px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee}
.row:last-child{border-bottom:none}code{font-size:12px;word-break:break-all}button{width:100%;padding:14px;border:0;border-radius:12px;margin-top:10px;font-size:16px;font-weight:700}
.primary{background:#1d1d1f;color:#fff}.secondary{background:#eee;color:#1d1d1f}#status{font-weight:700}
</style>
</head>
<body>
<main>
<h1>Capital Tracker 資料救援</h1>
<p>這個頁面只讀取同一個網站中的 localStorage，不會自動刪除任何資料。</p>
<div class="card"><div id="status">正在檢查...</div><div id="results"></div></div>
<div class="card">
<button class="primary" id="downloadAll">下載全部可找到的資料</button>
<button class="secondary" id="refresh">重新檢查</button>
</div>
<div class="card"><p><strong>重要：</strong>確認備份完成前，不要清除 Safari 的網站資料。</p></div>
<script>
const keys=["transactions","capital_tracker_transactions_v2","capital_tracker_transactions_v3","capital_tracker_transactions_v4"];
function inspect(){
 const results=document.getElementById("results"), status=document.getElementById("status");
 results.innerHTML=""; let found=0;
 for(const key of keys){
   const raw=localStorage.getItem(key); let count=0, valid=false;
   if(raw!==null){found++; try{const p=JSON.parse(raw); count=Array.isArray(p)?p.length:(p&&Array.isArray(p.transactions)?p.transactions.length:0); valid=true;}catch(e){}}
   const row=document.createElement("div"); row.className="row";
   row.innerHTML=`<div><code>${key}</code></div><div>${raw===null?"沒有資料":(valid?count+" 筆":"有內容")}</div>`;
   results.appendChild(row);
 }
 status.textContent=found>0?`找到 ${found} 組儲存資料`:"目前沒有找到舊資料";
}
function downloadAll(){
 const backup={exportedAt:new Date().toISOString(),origin:location.origin,localStorage:{}};
 for(const key of keys){const raw=localStorage.getItem(key); if(raw!==null) backup.localStorage[key]=raw;}
 const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json;charset=utf-8"});
 const url=URL.createObjectURL(blob), a=document.createElement("a");
 a.href=url; a.download="capital-tracker-recovery-backup.json"; document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.getElementById("downloadAll").addEventListener("click",downloadAll);
document.getElementById("refresh").addEventListener("click",inspect);
inspect();
</script>
</main>
</body>
</html>
